name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # checkout only

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: ember-a11y-mcp

jobs:
  changes:
    name: Classify CI changes
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release-only: ${{ steps.classify.outputs.release-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ember-a11y-mcp
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          # A pull_request checkout is the test merge; its first parent is the base.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          release_only=$(node scripts/is-release-metadata-only.js "$BASE" HEAD)
          echo "release-only=$release_only" >> "$GITHUB_OUTPUT"

  unit:
    name: Unit (Node ${{ matrix.node }})
    needs: changes
    # Keep both matrix check names present for branch protection, even on a release-only diff.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_TESTS: ${{ needs.changes.result != 'success' || needs.changes.outputs.release-only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_TESTS == 'true'
        with:
          # Check out into a subfolder so the source clones sit next to it, as they do locally.
          path: ember-a11y-mcp
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.RUN_TESTS == 'true'
        with:
          package_json_file: ember-a11y-mcp/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.RUN_TESTS == 'true'
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: ember-a11y-mcp/pnpm-lock.yaml
      # Source clones at the commits recorded in data/*.json, for the corpus tests.
      - run: node scripts/clone-sources.js
        if: env.RUN_TESTS == 'true'
      - run: pnpm install --frozen-lockfile
        if: env.RUN_TESTS == 'true'
      - run: pnpm test:coverage
        if: env.RUN_TESTS == 'true'

  e2e:
    name: E2E (stdio, package, data rebuild, browser oracle)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.release-only != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out into a subfolder so the source clones sit next to it, as they do locally.
          path: ember-a11y-mcp
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ember-a11y-mcp/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ember-a11y-mcp/pnpm-lock.yaml
      - run: node scripts/clone-sources.js
      - run: pnpm install --frozen-lockfile
      # Google Chrome is preinstalled on GitHub's Ubuntu runners; the HDS showcase suite skips itself here.
      - run: pnpm test:e2e

  hds-showcase:
    name: E2E (generated tests in the HDS showcase)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.release-only != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out into a subfolder so the source clones sit next to it, as they do locally.
          path: ember-a11y-mcp
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ember-a11y-mcp/package.json
      # HDS requires Node 24.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/clone-sources.js --only design-system
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-hds-${{ runner.os }}-${{ hashFiles('ember-a11y-mcp/pnpm-lock.yaml', 'design-system/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-hds-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # pnpm switches to the version pinned by HDS's packageManager field.
      - run: pnpm install --frozen-lockfile
        working-directory: design-system
      - run: pnpm build:packages
        working-directory: design-system/showcase
      - run: pnpm test:e2e:hds
        env:
          REQUIRE_HDS: '1'
